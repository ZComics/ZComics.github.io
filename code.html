<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZComics Code</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0f0e; color: #e8f0ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 20px;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .logo { font-size: 15px; font-weight: 700; letter-spacing: .12em; color: #00b8a9; text-transform: uppercase; margin-bottom: 10px; }
  h1 { font-size: 30px; font-weight: 800; line-height: 1.25; margin-bottom: 16px; }
  .desc { font-size: 16px; line-height: 1.7; color: #b9cbc7; margin-bottom: 28px; }
  .desc strong { color: #e8f0ee; }
  #watchBtn {
    display: block; width: 100%; border: 0; border-radius: 14px; cursor: pointer;
    background: #00b8a9; color: #04211e; font-size: 18px; font-weight: 800;
    padding: 18px 16px; line-height: 1.4;
  }
  #watchBtn:disabled { background: #23403c; color: #7fa39d; cursor: not-allowed; }
  #status { min-height: 24px; margin-top: 16px; font-size: 15px; line-height: 1.6; color: #8fb8b2; }
  #status.error { color: #ff9a8a; }
  #status.ok { color: #00b8a9; }
  #codeBox { display: none; margin-top: 28px; padding: 22px 16px; border: 1px solid #00b8a9; border-radius: 16px; background: #0e1a17; }
  #codeBox.show { display: block; }
  .code-label { font-size: 14px; color: #8fb8b2; margin-bottom: 8px; }
  #codeValue { font-size: 44px; font-weight: 800; letter-spacing: .08em; color: #00b8a9; word-break: break-all; line-height: 1.2; margin-bottom: 18px; }
  #copyBtn {
    border: 1px solid #00b8a9; background: transparent; color: #00b8a9;
    font-size: 16px; font-weight: 700; border-radius: 10px; padding: 12px 28px; cursor: pointer;
  }
  #copyBtn:active { background: #00b8a9; color: #04211e; }
  .note { margin-top: 24px; font-size: 13px; line-height: 1.6; color: #6f8a85; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">ZComics</div>
  <h1>ZComics Code</h1>
  <p class="desc">ကြော်ငြာကို <strong>အဆုံးထိ ကြည့်ပြီးရင်</strong> ဒီနေ့အတွက် 18+ code ကို ရမယ်။<br>Code က <strong>နေ့တိုင်း ပြောင်းတယ်</strong> — မနက်ဖြန်ဆိုရင် code အသစ် ထပ်ယူရမယ်။</p>

  <button id="watchBtn" type="button">ကြော်ငြာကြည့်ပြီး Code ရယူမယ်</button>
  <p id="status" role="status" aria-live="polite"></p>

  <div id="codeBox">
    <div class="code-label">ဒီနေ့ 18+ Code</div>
    <div id="codeValue"></div>
    <button id="copyBtn" type="button">Copy ကူးမယ်</button>
  </div>

  <p class="note">Code ကို ZComics app ထဲက 18+ အခန်းမှာ ထည့်သုံးပါ။</p>
</main>

<script>
  // ============================================================
  // AdsGram blockId — REPLACE THIS PLACEHOLDER
  // partner.adsgram.ai မှာ block လုပ်ပြီးရင် ရတဲ့ ဂဏန်း blockId
  // (ဥပမာ "12345") ကို ဒီနေရာမှာ အစားထိုးပါ။
  // ============================================================
  const ADSGRAM_BLOCK_ID = "59190";

  const CODE_CSV_URL = "https://docs.google.com/spreadsheets/d/17doZR1WsYzsRn39NbiFSByEZTlzkaz6majHf7uaJYNo/export?format=csv&gid=1296961333";

  const watchBtn = document.getElementById("watchBtn");
  const copyBtn = document.getElementById("copyBtn");
  const statusEl = document.getElementById("status");
  const codeBox = document.getElementById("codeBox");
  const codeValue = document.getElementById("codeValue");

  let AdController = null;

  // Telegram WebApp — guarded so the page also works in a normal browser
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  } catch (e) { /* ignore — normal browser test mode */ }

  function setStatus(text, kind) {
    statusEl.textContent = text || "";
    statusEl.className = kind || "";
  }

  function isPlaceholder() {
    return !ADSGRAM_BLOCK_ID || ADSGRAM_BLOCK_ID === "YOUR-BLOCK-ID";
  }

  function initAds() {
    if (isPlaceholder()) return null;
    try {
      if (window.Adsgram) {
        return window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID, debug: false });
      }
    } catch (e) { /* AdsGram SDK failed to load/init */ }
    return null;
  }

  // Initialise the AdsGram controller once
  if (isPlaceholder()) {
    watchBtn.disabled = true;
    setStatus("Ads မချိတ်ရသေးဘူး — blockId လိုတယ်", "error");
  } else {
    AdController = initAds();
    if (!AdController) {
      watchBtn.disabled = true;
      setStatus("Ads မချိတ်ရသေးဘူး — blockId လိုတယ်", "error");
    }
  }

  function parseFirstCell(csv) {
    // Parse cell A1 of the first row (handles a quoted first cell)
    const firstLine = (csv || "").split(/\r?\n/)[0] || "";
    const m = firstLine.match(/^"((?:[^"]|"")*)"/);
    if (m) return m[1].replace(/""/g, '"').trim();
    return (firstLine.split(",")[0] || "").trim();
  }

  async function fetchTodaysCode() {
    const res = await fetch(CODE_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("csv " + res.status);
    const code = parseFirstCell(await res.text());
    if (!code) throw new Error("empty code");
    return code;
  }

  watchBtn.addEventListener("click", async function () {
    if (isPlaceholder()) {
      setStatus("Ads မချိတ်ရသေးဘူး — blockId လိုတယ်", "error");
      return;
    }
    if (!AdController) AdController = initAds();
    if (!AdController) {
      setStatus("Ad မပြီးသေးလို့ code မရဘူး — ထပ်ကြိုးစားပါ", "error");
      return;
    }
    watchBtn.disabled = true;
    setStatus("ကြော်ငြာ ဖွင့်နေတယ်… အဆုံးထိ ကြည့်ပါ");
    try {
      await AdController.show();
    } catch (e) {
      // Rejected = ad failed or was closed early — do NOT reveal the code
      codeBox.classList.remove("show");
      codeValue.textContent = "";
      setStatus("Ad မပြီးသေးလို့ code မရဘူး — ထပ်ကြိုးစားပါ", "error");
      watchBtn.disabled = false;
      return;
    }
    // Reward earned — now fetch and reveal today's code
    setStatus("Code ယူနေတယ်…");
    try {
      const code = await fetchTodaysCode();
      codeValue.textContent = code;
      codeBox.classList.add("show");
      setStatus("ရပြီ — ဒီ code ကို app ထဲမှာ ထည့်သုံးပါ", "ok");
    } catch (e) {
      setStatus("Code ယူလို့ မရဘူး — ထပ်ကြိုးစားပါ", "error");
    }
    watchBtn.disabled = false;
  });

  copyBtn.addEventListener("click", async function () {
    const code = codeValue.textContent.trim();
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code);
      copyBtn.textContent = "ကူးပြီးပြီ ✓";
    } catch (e) {
      // Fallback for browsers without Clipboard API permission
      const ta = document.createElement("textarea");
      ta.value = code; document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); copyBtn.textContent = "ကူးပြီးပြီ ✓"; } catch (_) {}
      document.body.removeChild(ta);
    }
    setTimeout(function () { copyBtn.textContent = "Copy ကူးမယ်"; }, 2000);
  });
</script>
</body>
</html>
